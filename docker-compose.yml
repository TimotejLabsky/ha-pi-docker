version: '3.9'
services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /home/cloud-key/homeassistant:/config
    restart: unless-stopped
    privileged: true
    network_mode: host
    ports:
      - "8123:8123"

  nginx:
    image: nginx:latest
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    network_mode: host
    ports:
      - "80:80"
    depends_on:
      - homeassistant